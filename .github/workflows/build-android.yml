name: Build ZIMSEC Junior Revision Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare HTML application
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets/www

          HTML_FILE=$(find . -maxdepth 1 -type f \
            -iname 'ZIMSEC_Junior_Revision_Hub*.html' \
            | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: ZIMSEC Junior Revision Hub HTML file was not found."
            exit 1
          fi

          echo "Using HTML file: $HTML_FILE"

          cp "$HTML_FILE" app/src/main/assets/www/index.html

      - name: Verify Android project
        run: |
          echo "Android project:"
          find app/src/main -maxdepth 5 -type f | sort

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Build release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIMSEC-Junior-Revision-Hub-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZIMSEC-Junior-Revision-Hub-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
